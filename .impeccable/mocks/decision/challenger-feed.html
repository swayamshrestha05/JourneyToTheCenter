<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>One Layer per Screen sketch</title>
<style>
  html,body{margin:0;width:1440px;height:900px;overflow:hidden;font-family:Arial,sans-serif;color:#fff}
  .stage{position:absolute;inset:0;background:linear-gradient(#c9d6e3 0 55%,#e6a39b 55%)}
  .peak{position:absolute;left:0;right:0;bottom:0;height:720px}
  .scrim{position:absolute;left:0;right:0;bottom:0;height:320px;background:linear-gradient(transparent,rgba(0,0,0,.75))}
  .cap{position:absolute;left:72px;bottom:70px;max-width:760px}
  .cap .au{font-size:40px;font-weight:800}
  .cap .tx{font-size:30px;line-height:1.25;margin-top:10px}
  .rail{position:absolute;right:56px;bottom:90px;display:flex;flex-direction:column;gap:34px;align-items:center}
  .g{width:72px;height:72px;border-radius:50%;border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800}
  .next{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);font-size:24px}
</style></head><body>
<div class="stage">
  <svg class="peak" viewBox="0 0 1440 720" preserveAspectRatio="none"><path d="M0 720 L380 300 L620 380 L820 60 L1000 260 L1440 420 L1440 720Z" fill="#8fb3d9"/></svg>
  <div class="scrim"></div>
  <div class="cap"><div class="au">+8,849 m · Summit</div><div class="tx">These summit rocks were once ocean floor, packed with marine fossils.</div></div>
  <div class="rail"><div class="g">i</div><div class="g">⇄</div><div class="g">°C</div><div class="g">≡</div></div>
  <div class="next">▼ Crust</div>
</div>
</body></html>
