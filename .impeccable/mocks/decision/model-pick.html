<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Core Tray sketch</title>
<style>
  html,body{margin:0;width:1440px;height:900px;overflow:hidden;background:#2b2420;font-family:"Arial Narrow",Arial,sans-serif;color:#f2f0ea}
  .tray{position:absolute;left:80px;right:80px;top:150px;height:640px;background:#b98a57;border:10px solid #8a6238;display:grid;grid-template-rows:repeat(3,1fr);gap:14px;padding:14px}
  .row{background:#7a5a36;position:relative;display:flex;align-items:center;padding:0 16px;gap:12px}
  .core{height:120px;border-radius:60px;flex:1}
  .blk{width:110px;height:120px;background:#f2f0ea;color:#2b2420;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800}
  .blk b{font-size:30px}
  h1{position:absolute;left:80px;top:40px;margin:0;font-size:64px;letter-spacing:.02em;text-transform:uppercase}
  .box{position:absolute;right:80px;top:56px;font-size:30px;font-weight:700;color:#d8d2c4}
</style></head><body>
<h1>Box 1 · Summit</h1><div class="box">8,849 m → sea level</div>
<div class="tray">
  <div class="row"><div class="blk"><b>8,849</b>m</div><div class="core" style="background:repeating-linear-gradient(90deg,#9aa3a6 0 70px,#b6bdbf 70px 140px)"></div></div>
  <div class="row"><div class="blk"><b>6,000</b>m</div><div class="core" style="background:#9aa3a6"></div></div>
  <div class="row"><div class="blk"><b>±0</b>m</div><div class="core" style="background:linear-gradient(90deg,#9aa3a6 60%,#d8a59a 60%)"></div></div>
</div>
</body></html>
